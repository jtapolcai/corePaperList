name: Weekly DBLP Update

on:
  schedule:
    - cron: "0 4 * * 1"   # Hétfőnként 04:00 UTC
  workflow_dispatch:        # Kézi indítás is lehetséges

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests xmltodict unidecode pandas matplotlib

      - name: Run DBLP update and paper classification
        run: python3 run_every_day.py
        env:
          SKIP_SHEET_WRITE: "1"

      - name: Regenerate index.html
        run: python3 gen_index_html.py

      - name: Regenerate authors_profile.html
        run: python3 gen_authors_html.py

      - name: Regenerate core_papers.html
        run: python3 gen_core_papers_html.py

      - name: Install pandas for authors_table
        run: pip install pandas

      - name: Regenerate authors_table.html
        run: python3 gen_authors_table.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ authors.json dblp/ \
                  index.html authors_profile.html core_papers.html authors_table.html \
                  profiles/_mta_photos.json || true
          if git diff --cached --quiet; then
            echo "Nincs változás"
          else
            git commit -m "Weekly DBLP update $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push
          fi
