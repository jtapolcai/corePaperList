name: Weekly DBLP Update

on:
  schedule:
    - cron: "0 4 * * 1"   # Hétfőnként 04:00 UTC
  workflow_dispatch:        # Kézi indítás is lehetséges

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests xmltodict unidecode pandas matplotlib anthropic

      - name: Run DBLP update and paper classification
        id: dblp
        run: python3 run_every_day.py
        continue-on-error: true
        env:
          SKIP_SHEET_WRITE: "1"

      - name: Compile authors.json from profiles + results
        id: compile
        run: python3 compile_authors_json.py
        continue-on-error: true

      # OpenAlex enrichment runs locally (~twice a year), not in CI

      - name: Generate report figure CSVs
        id: report_data
        run: python3 gen_report_data.py
        continue-on-error: true

      - name: Generate report.html
        id: report_html
        run: python3 gen_report_html.py
        continue-on-error: true

      - name: Regenerate index.html
        id: index
        run: python3 gen_index_html.py
        continue-on-error: true

      - name: Regenerate authors_profile.html
        id: authors
        run: python3 gen_authors_html.py
        continue-on-error: true

      - name: Regenerate core_papers.html
        id: core
        run: python3 gen_core_papers_html.py
        continue-on-error: true

      - name: Install pandas for authors_table
        run: pip install pandas

      - name: Regenerate authors_table.html
        id: table
        run: python3 gen_authors_table.py
        continue-on-error: true

      - name: Install LaTeX
        run: sudo apt-get install -y texlive-latex-extra texlive-lang-european texlive-fonts-recommended

      - name: Compile Hungarian PDF
        id: pdf_hu
        run: |
          cd doc
          pdflatex -interaction=nonstopmode report.tex
          pdflatex -interaction=nonstopmode report.tex
        continue-on-error: true

      - name: Compile English PDF
        id: pdf_en
        run: |
          cd doc
          pdflatex -interaction=nonstopmode report_en.tex
          pdflatex -interaction=nonstopmode report_en.tex
        continue-on-error: true

      - name: Update report_meta.json with PDF dates
        run: |
          python3 - <<'EOF'
          import json, datetime, pathlib, os
          p = pathlib.Path('report_meta.json')
          meta = json.loads(p.read_text()) if p.exists() else {}
          today = datetime.date.today().isoformat()
          if pathlib.Path('doc/report.pdf').exists():
              meta['hu_pdf_url'] = 'doc/report.pdf'
              meta['hu_pdf_date'] = today
          if pathlib.Path('doc/report_en.pdf').exists():
              meta['en_pdf_url'] = 'doc/report_en.pdf'
              meta['en_pdf_date'] = today
          p.write_text(json.dumps(meta, indent=2) + '\n')
          EOF
        continue-on-error: true

      - name: Ensure weekly-digest label exists
        run: |
          gh label create "weekly-digest" --color "0075ca" --description "Automatikus heti CORE cikk összefoglaló" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post weekly digest as GitHub Issue
        id: email
        run: python3 send_weekly_email.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit changes
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ authors.json dblp/ profiles/ figures/ \
                  index.html authors_profile.html core_papers.html authors_table.html report.html \
                  doc/report.pdf doc/report_en.pdf report_meta.json || true
          if git diff --cached --quiet; then
            echo "Nincs változás"
          else
            git commit -m "Weekly DBLP update $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Check for failures
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.dblp.outcome }}"    = "failure" ] && FAILED="$FAILED dblp"
          [ "${{ steps.compile.outcome }}"      = "failure" ] && FAILED="$FAILED compile_authors"
          [ "${{ steps.report_data.outcome }}" = "failure" ] && FAILED="$FAILED report_data"
          [ "${{ steps.report_html.outcome }}" = "failure" ] && FAILED="$FAILED report.html"
          [ "${{ steps.index.outcome }}"        = "failure" ] && FAILED="$FAILED index.html"
          [ "${{ steps.authors.outcome }}" = "failure" ] && FAILED="$FAILED authors_profile.html"
          [ "${{ steps.core.outcome }}"    = "failure" ] && FAILED="$FAILED core_papers.html"
          [ "${{ steps.table.outcome }}"   = "failure" ] && FAILED="$FAILED authors_table.html"
          [ "${{ steps.pdf_hu.outcome }}"  = "failure" ] && FAILED="$FAILED pdf_hu"
          [ "${{ steps.pdf_en.outcome }}"  = "failure" ] && FAILED="$FAILED pdf_en"
          if [ -n "$FAILED" ]; then
            echo "::error::A következő lépések hibával végződtek:$FAILED"
            exit 1
          fi
