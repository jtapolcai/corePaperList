name: Weekly DBLP Update

on:
  schedule:
    - cron: "0 4 * * 1"   # Hétfőnként 04:00 UTC
  workflow_dispatch:        # Kézi indítás is lehetséges

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests xmltodict unidecode pandas matplotlib

      - name: Run DBLP update and paper classification
        id: dblp
        run: python3 run_every_day.py
        continue-on-error: true
        env:
          SKIP_SHEET_WRITE: "1"

      - name: Compile authors.json from profiles + results
        id: compile
        run: python3 compile_authors_json.py
        continue-on-error: true

      - name: Generate report figure CSVs
        id: report_data
        run: python3 gen_report_data.py
        continue-on-error: true

      - name: Generate report.html
        id: report_html
        run: python3 gen_report_html.py
        continue-on-error: true

      - name: Regenerate index.html
        id: index
        run: python3 gen_index_html.py
        continue-on-error: true

      - name: Regenerate authors_profile.html
        id: authors
        run: python3 gen_authors_html.py
        continue-on-error: true

      - name: Regenerate core_papers.html
        id: core
        run: python3 gen_core_papers_html.py
        continue-on-error: true

      - name: Install pandas for authors_table
        run: pip install pandas

      - name: Regenerate authors_table.html
        id: table
        run: python3 gen_authors_table.py
        continue-on-error: true

      - name: Commit changes
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ authors.json dblp/ profiles/ figures/ \
                  index.html authors_profile.html core_papers.html authors_table.html report.html || true
          if git diff --cached --quiet; then
            echo "Nincs változás"
          else
            git commit -m "Weekly DBLP update $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Check for failures
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.dblp.outcome }}"    = "failure" ] && FAILED="$FAILED dblp"
          [ "${{ steps.compile.outcome }}"      = "failure" ] && FAILED="$FAILED compile_authors"
          [ "${{ steps.report_data.outcome }}" = "failure" ] && FAILED="$FAILED report_data"
          [ "${{ steps.report_html.outcome }}" = "failure" ] && FAILED="$FAILED report.html"
          [ "${{ steps.index.outcome }}"        = "failure" ] && FAILED="$FAILED index.html"
          [ "${{ steps.authors.outcome }}" = "failure" ] && FAILED="$FAILED authors_profile.html"
          [ "${{ steps.core.outcome }}"    = "failure" ] && FAILED="$FAILED core_papers.html"
          [ "${{ steps.table.outcome }}"   = "failure" ] && FAILED="$FAILED authors_table.html"
          if [ -n "$FAILED" ]; then
            echo "::error::A következő lépések hibával végződtek:$FAILED"
            exit 1
          fi
