name: Test Email

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Email cím ahova a teszt email megy'
        required: false
        default: 'janos.tapolcai@gmail.com'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Send test email
        run: python3 test_email.py "${{ github.event.inputs.recipient }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
