name: Regenerate HTML

on:
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - "authors.json"
      - "results/*.json"
      - "results/coreAstar.bib"
      - "results/coreA.bib"
      - "gen_authors_html.py"
      - "gen_core_papers_html.py"
      - "gen_authors_table.py"
      - "gen_index_html.py"
      - "src/create_itable.py"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile authors.json from profiles
        run: python3 compile_authors_json.py

      - name: Regenerate index.html (dashboard)
        run: python3 gen_index_html.py

      - name: Regenerate authors_profile.html
        run: python3 gen_authors_html.py

      - name: Regenerate core_papers.html
        run: python3 gen_core_papers_html.py

      - name: Install dependencies for authors_table
        run: pip install pandas requests

      - name: Regenerate authors_table.html
        run: python3 gen_authors_table.py

      - name: Commit updated HTML if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add authors.json index.html authors_profile.html core_papers.html authors_table.html profiles/_mta_photos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-regenerate HTML [skip ci]"
            git push
          fi
