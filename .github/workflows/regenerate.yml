name: Regenerate HTML

on:
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - "authors.json"
      - "results/*.json"
      - "results/coreAstar.bib"
      - "results/coreA.bib"
      - "gen_authors_html.py"
      - "gen_core_astar_html.py"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate authors_profile.html
        run: python3 gen_authors_html.py

      - name: Regenerate core_astar.html
        run: python3 gen_core_astar_html.py

      - name: Commit updated HTML if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add authors_profile.html core_astar.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-regenerate HTML [skip ci]"
            git push
          fi
